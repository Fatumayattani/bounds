[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "../node_modules"]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@gluwa/asc-contracts/=../node_modules/@gluwa/asc-contracts/"
]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true

# See https://book.getfoundry.sh/reference/config/overview
